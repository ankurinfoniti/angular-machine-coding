<div class="readmore-container">
  <h1 class="title">Read More Toggle</h1>
  <p class="readmore-text">
    {{ isReadMore ? text : (text | slice: 0 : 100) + '...' }}
  </p>
  <button class="readmore-button" (click)="toggleReadMore()">
    {{ isReadMore ? 'Read Less' : 'Read More' }}
  </button>
</div>
